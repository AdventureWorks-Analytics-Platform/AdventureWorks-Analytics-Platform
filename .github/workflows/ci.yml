name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -m "not integration" -q --junitxml=unit-test-results.xml
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run formatting, lint, and type checks
        shell: bash
        run: |
          set +e
          python -m black --check src tests main.py 2>&1 | tee black.log
          black_status=${PIPESTATUS[0]}
          python -m flake8 src tests main.py 2>&1 | tee flake8.log
          flake8_status=${PIPESTATUS[0]}
          python -m mypy src 2>&1 | tee mypy.log
          mypy_status=${PIPESTATUS[0]}
          printf 'black=%s flake8=%s mypy=%s\n' "$black_status" "$flake8_status" "$mypy_status" | tee quality-status.txt
          if (( black_status != 0 || flake8_status != 0 || mypy_status != 0 )); then
            exit 1
          fi
          exit 0
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            black.log
            flake8.log
            mypy.log
            quality-status.txt

  integration-postgres:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 55432
      POSTGRES_DATABASE: adventureworks_test
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: integration_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start isolated PostgreSQL integration database
        run: docker compose -p adventureworks-ci-integration -f docker-compose.integration.yml up -d --wait
      - name: Run PostgreSQL integration tests
        run: python -m pytest -m "postgres_integration and not sqlserver_integration" -q --junitxml=postgres-integration-results.xml
      - name: Upload PostgreSQL integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-evidence
          path: postgres-integration-results.xml
      - name: Stop isolated PostgreSQL integration database
        if: always()
        run: docker compose -p adventureworks-ci-integration -f docker-compose.integration.yml down -v

  integration-sqlserver:
    if: ${{ vars.SQL_SERVER_HOST != '' }}
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SQL_SERVER_HOST: ${{ vars.SQL_SERVER_HOST }}
      SQL_SERVER_PORT: ${{ vars.SQL_SERVER_PORT || '1433' }}
      SQL_SERVER_DATABASE: ${{ vars.SQL_SERVER_DATABASE || 'AdventureWorks2012' }}
      SQL_SERVER_AUTH_MODE: sql
      SQL_SERVER_USERNAME: ${{ secrets.SQL_SERVER_USERNAME }}
      SQL_SERVER_PASSWORD: ${{ secrets.SQL_SERVER_PASSWORD }}
      SQL_SERVER_DRIVER: ODBC Driver 18 for SQL Server
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 55432
      POSTGRES_DATABASE: adventureworks_test
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: integration_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Microsoft ODBC Driver 18
        shell: bash
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start isolated PostgreSQL integration database
        run: docker compose -p adventureworks-ci-sqlserver -f docker-compose.integration.yml up -d --wait
      - name: Run SQL Server integration tests
        run: python -m pytest -m sqlserver_integration -q --junitxml=sqlserver-integration-results.xml
      - name: Upload SQL Server integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-integration-evidence
          path: sqlserver-integration-results.xml
      - name: Stop isolated PostgreSQL integration database
        if: always()
        run: docker compose -p adventureworks-ci-sqlserver -f docker-compose.integration.yml down -v
