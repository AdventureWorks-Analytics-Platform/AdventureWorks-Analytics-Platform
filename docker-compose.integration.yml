services:
  postgres-integration:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: adventureworks_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration_test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./scripts/warehouse/postgres/init/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adventureworks_test"]
      interval: 5s
      timeout: 5s
      retries: 12
