services:
  postgres:
    image: postgres:15-alpine
    container_name: adventureworks-warehouse
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-adventureworks_warehouse}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting PostgreSQL}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/warehouse/postgres/init/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DATABASE:-adventureworks_warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adventureworks

volumes:
  postgres_data:

networks:
  adventureworks:
    driver: bridge
